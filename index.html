<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitWay - Kaleidoscope Interface</title>

    <!-- System Monitor -->
    <script src="gateway/system-monitor.js"></script>

    <!-- Kaleidoscope Renderer -->
    <script src="kaleidoscope/renderer.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        #loading h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        #loading .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #app {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #app.ready {
            opacity: 1;
        }

        /* Metric Card Styles */
        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
        }

        /* Grid Layout */
        .kaleidoscope-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* Error Message */
        .error-message {
            background: white;
            color: #ef4444;
            padding: 20px;
            border-radius: 12px;
            margin: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <h1>🎨 Kaleidoscope</h1>
        <div class="spinner"></div>
        <p style="color: white; margin-top: 20px;">Loading GitWay Interface...</p>
    </div>

    <!-- Main App Container -->
    <div id="app"></div>

    <script>
        /**
         * GitWay Kaleidoscope Loader
         * This is a thin pass-through layer that loads and renders Kaleidoscope projects
         */

        // Check for API mode
        function checkAPIMode() {
            const params = new URLSearchParams(window.location.search);
            const apiPath = params.get('api');

            if (apiPath) {
                // API mode - return JSON
                handleAPIRequest(apiPath);
                return true;
            }
            return false;
        }

        // Handle API requests
        async function handleAPIRequest(endpoint) {
            const response = {
                endpoint: endpoint,
                timestamp: new Date().toISOString(),
                data: {}
            };

            // Route API endpoints
            switch(endpoint) {
                case 'status':
                    response.data = {
                        status: 'online',
                        renderer: 'kaleidoscope',
                        version: '1.0.0'
                    };
                    break;
                case 'config':
                    response.data = {
                        project: 'GitWay',
                        gateway: { host: 'pred', port: 8088 },
                        bridge: { url: 'http://localhost:3001' }
                    };
                    break;
                case 'views':
                    response.data = {
                        available: ['Dashboard', 'Gateway', 'Integration', 'Tags', 'GitDB']
                    };
                    break;
                default:
                    response.error = 'Unknown endpoint';
            }

            // Return JSON response
            document.body.innerHTML = '';
            document.body.style.background = '#1f2937';
            document.body.style.color = '#10b981';
            document.body.style.fontFamily = 'monospace';
            document.body.style.padding = '20px';

            const pre = document.createElement('pre');
            pre.textContent = JSON.stringify(response, null, 2);
            document.body.appendChild(pre);
        }

        // Initialize Kaleidoscope
        async function initializeKaleidoscope() {
            try {
                // Check for API mode first
                if (checkAPIMode()) {
                    return;
                }

                // Create Kaleidoscope renderer
                const renderer = new KaleidoscopeRenderer();

                // Initialize renderer
                await renderer.initialize();

                // Hide loading screen
                const loading = document.getElementById('loading');
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.style.display = 'none';
                    document.getElementById('app').classList.add('ready');
                }, 500);

                // Store renderer globally for debugging
                window.kaleidoscope = renderer;

                console.log('Kaleidoscope initialized successfully');

            } catch (error) {
                console.error('Failed to initialize Kaleidoscope:', error);
                showError(error.message);
            }
        }

        // Show error message
        function showError(message) {
            const loading = document.getElementById('loading');
            loading.style.display = 'none';

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="error-message">
                    <h2>⚠️ Initialization Error</h2>
                    <p>${message}</p>
                    <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">
                        Retry
                    </button>
                </div>
            `;
            app.classList.add('ready');
        }

        // Handle page visibility for performance
        document.addEventListener('visibilitychange', () => {
            if (window.kaleidoscope) {
                if (document.hidden) {
                    // Pause updates when page is hidden
                    console.log('Page hidden, pausing updates');
                } else {
                    // Resume updates when page is visible
                    console.log('Page visible, resuming updates');
                }
            }
        });

        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeKaleidoscope);
        } else {
            initializeKaleidoscope();
        }

        // Handle unload
        window.addEventListener('beforeunload', () => {
            if (window.kaleidoscope) {
                window.kaleidoscope.destroy();
            }
        });
    </script>
</body>
</html>
