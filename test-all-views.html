<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitWay Views Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .view-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .view-card:hover {
            transform: translateY(-5px);
        }

        .view-card h2 {
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-card iframe {
            width: 100%;
            height: 400px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn.secondary {
            background: #64748b;
        }

        .btn.secondary:hover {
            background: #475569;
        }

        .status {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: auto;
        }

        .status.loading {
            background: #fef3c7;
            color: #92400e;
        }

        .status.loaded {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .api-test {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .test-all-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            font-size: 16px;
        }

        .test-results {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .test-results h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .result-item {
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #e5e7eb;
            background: #f9fafb;
        }

        .result-item.success {
            border-left-color: #10b981;
        }

        .result-item.error {
            border-left-color: #ef4444;
        }
    </style>
</head>
<body>
    <h1>🎨 GitWay Views Test Dashboard</h1>

    <div class="container">
        <button class="btn test-all-btn" onclick="testAllViews()">🚀 Test All Views</button>

        <div class="test-grid">
            <!-- Dashboard View -->
            <div class="view-card">
                <h2>
                    📊 Dashboard
                    <span class="status loading" id="status-dashboard">Loading...</span>
                </h2>
                <iframe id="frame-dashboard" src="https://teslasolar.github.io/gitway/?view=Dashboard"></iframe>
                <div class="buttons">
                    <a href="https://teslasolar.github.io/gitway/?view=Dashboard" target="_blank" class="btn">Open Full</a>
                    <button class="btn secondary" onclick="reloadFrame('dashboard')">Reload</button>
                </div>
            </div>

            <!-- Gateway View -->
            <div class="view-card">
                <h2>
                    🌐 Gateway
                    <span class="status loading" id="status-gateway">Loading...</span>
                </h2>
                <iframe id="frame-gateway" src="https://teslasolar.github.io/gitway/?view=Gateway"></iframe>
                <div class="buttons">
                    <a href="https://teslasolar.github.io/gitway/?view=Gateway" target="_blank" class="btn">Open Full</a>
                    <button class="btn secondary" onclick="reloadFrame('gateway')">Reload</button>
                </div>
            </div>

            <!-- Integration View -->
            <div class="view-card">
                <h2>
                    🔧 Integration
                    <span class="status loading" id="status-integration">Loading...</span>
                </h2>
                <iframe id="frame-integration" src="https://teslasolar.github.io/gitway/?view=Integration"></iframe>
                <div class="buttons">
                    <a href="https://teslasolar.github.io/gitway/?view=Integration" target="_blank" class="btn">Open Full</a>
                    <button class="btn secondary" onclick="reloadFrame('integration')">Reload</button>
                </div>
            </div>

            <!-- Tags View -->
            <div class="view-card">
                <h2>
                    🏷️ Tags
                    <span class="status loading" id="status-tags">Loading...</span>
                </h2>
                <iframe id="frame-tags" src="https://teslasolar.github.io/gitway/?view=Tags"></iframe>
                <div class="buttons">
                    <a href="https://teslasolar.github.io/gitway/?view=Tags" target="_blank" class="btn">Open Full</a>
                    <button class="btn secondary" onclick="reloadFrame('tags')">Reload</button>
                </div>
            </div>

            <!-- GitDB View -->
            <div class="view-card">
                <h2>
                    🗄️ GitDB
                    <span class="status loading" id="status-gitdb">Loading...</span>
                </h2>
                <iframe id="frame-gitdb" src="https://teslasolar.github.io/gitway/?view=GitDB"></iframe>
                <div class="buttons">
                    <a href="https://teslasolar.github.io/gitway/?view=GitDB" target="_blank" class="btn">Open Full</a>
                    <button class="btn secondary" onclick="reloadFrame('gitdb')">Reload</button>
                </div>
            </div>

            <!-- API Test -->
            <div class="view-card">
                <h2>📡 API Tests</h2>
                <div class="api-test" id="api-results">Testing API endpoints...</div>
                <div class="buttons">
                    <button class="btn" onclick="testAPI('status')">Test Status</button>
                    <button class="btn" onclick="testAPI('config')">Test Config</button>
                    <button class="btn" onclick="testAPI('views')">Test Views</button>
                </div>
            </div>
        </div>

        <div class="test-results">
            <h2>🧪 Test Results</h2>
            <div id="test-results-content">
                <div class="result-item">Waiting for tests...</div>
            </div>
        </div>
    </div>

    <script>
        const views = ['dashboard', 'gateway', 'integration', 'tags', 'gitdb'];
        const baseUrl = 'https://teslasolar.github.io/gitway';
        const results = [];

        // Monitor iframe loading
        views.forEach(view => {
            const frame = document.getElementById(`frame-${view}`);
            const status = document.getElementById(`status-${view}`);

            frame.addEventListener('load', () => {
                status.className = 'status loaded';
                status.textContent = 'Loaded';
                addResult(`✅ ${view} view loaded successfully`, 'success');
            });

            frame.addEventListener('error', () => {
                status.className = 'status error';
                status.textContent = 'Error';
                addResult(`❌ ${view} view failed to load`, 'error');
            });
        });

        function reloadFrame(view) {
            const frame = document.getElementById(`frame-${view}`);
            const status = document.getElementById(`status-${view}`);
            status.className = 'status loading';
            status.textContent = 'Loading...';
            frame.src = frame.src;
        }

        async function testAPI(endpoint) {
            const apiEl = document.getElementById('api-results');
            apiEl.textContent = `Testing ${endpoint}...`;

            try {
                const response = await fetch(`${baseUrl}/?api=${endpoint}`);
                const text = await response.text();

                // Try to parse as JSON
                try {
                    const json = JSON.parse(text);
                    apiEl.textContent = JSON.stringify(json, null, 2);
                    addResult(`✅ API ${endpoint} returned valid JSON`, 'success');
                } catch {
                    // If not JSON, show as text
                    apiEl.textContent = text.substring(0, 1000);
                    addResult(`⚠️ API ${endpoint} returned non-JSON response`, 'warning');
                }
            } catch (error) {
                apiEl.textContent = `Error: ${error.message}`;
                addResult(`❌ API ${endpoint} failed: ${error.message}`, 'error');
            }
        }

        async function testAllViews() {
            const resultsEl = document.getElementById('test-results-content');
            resultsEl.innerHTML = '<div class="result-item">Starting tests...</div>';
            results.length = 0;

            // Test each view
            for (const view of views) {
                reloadFrame(view);
                await new Promise(resolve => setTimeout(resolve, 2000));
            }

            // Test API endpoints
            const apiEndpoints = ['status', 'config', 'views'];
            for (const endpoint of apiEndpoints) {
                await testAPI(endpoint);
                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            // Test bridge connection
            try {
                const bridgeResponse = await fetch('http://localhost:3001/api/status');
                if (bridgeResponse.ok) {
                    addResult('✅ Bridge server is running', 'success');
                } else {
                    addResult('⚠️ Bridge server returned non-OK status', 'warning');
                }
            } catch {
                addResult('❌ Bridge server is not accessible', 'error');
            }

            // Summary
            const successCount = results.filter(r => r.type === 'success').length;
            const errorCount = results.filter(r => r.type === 'error').length;
            addResult(`📊 Test Summary: ${successCount} passed, ${errorCount} failed`,
                      errorCount === 0 ? 'success' : 'warning');
        }

        function addResult(message, type = 'info') {
            const result = { message, type, time: new Date().toLocaleTimeString() };
            results.push(result);

            const resultsEl = document.getElementById('test-results-content');
            const resultItem = document.createElement('div');
            resultItem.className = `result-item ${type}`;
            resultItem.innerHTML = `<strong>${result.time}</strong> - ${message}`;
            resultsEl.appendChild(resultItem);
        }

        // Auto-test API on load
        setTimeout(() => {
            testAPI('status');
        }, 2000);
    </script>
</body>
</html>
